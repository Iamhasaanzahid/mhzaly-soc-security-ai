name: MHZALY Autonomous SOC Scan

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scheduled scans from racing each other while committing the DB.
concurrency:
  group: soc-scan
  cancel-in-progress: false

jobs:
  run-soc-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute All Active Targets Scan
        env:
          PYTHONPATH: ${{ github.workspace }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ZOOMEYE_API_KEY: ${{ secrets.ZOOMEYE_API_KEY }}
        run: |
          # Per-target failures are recorded in scan_runs, reported to Discord,
          # and handled inside the scheduler — one bad target must not fail the
          # job (previously it did, which then skipped the DB commit below).
          python3 -m core.scheduler run-all-once

      - name: Commit and Push Updated Database
        # Run even if the scan step reported a problem so findings from the
        # targets that succeeded are still persisted.
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- '*.db'; then
            echo "No database changes to commit."
            exit 0
          fi
          git add -- '*.db'
          git commit -m "Auto-update SOC scan database findings [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
