name: MHZALY Autonomous SOC Scan

on:
  schedule:
    - cron: '*/30 * * * *'  # Har 30 minute baad automatic run hoga
  workflow_dispatch:        # Aap khud bhi GitHub Actions tab se manual "Run workflow" daba sakte hain

jobs:
  run-soc-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Autonomous Scan Cycle
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 scheduler.py run-once
