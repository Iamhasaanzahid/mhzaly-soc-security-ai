name: Feature request
description: Propose a capability, integration or precision improvement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This platform deliberately reports fewer findings. Proposals that improve
        evidence quality, verification or reporting are prioritised over proposals
        that simply add more scanners.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? Describe the user-visible behaviour.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: How would this be verified?
      description: |
        Findings must survive the confidence gate. What evidence would a new check
        produce, and what would count as a false positive?
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Precision (fewer false positives)
        - Coverage (new verification)
        - Reporting / analyst experience
        - Operations (deploy, CI, monitoring)
